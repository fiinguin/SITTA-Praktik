<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SITTA-UT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="login-container">
        <img src="images/ut1.png" alt="Logo UT" class="login-logo">

        <h2>Universitas Terbuka</h2>
    <h4>Silahkan Login ke SITTA-UT</h4>
        
        <div class="form-container">
            <form id="loginForm">
   
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" required placeholder="Email" id="email" />
                </div>


                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" required placeholder="Password" id="password" />
                </div>

                <a href="#" id="forgetLink">Lupa Password?</a>
                <button type="submit">Login</button>
            </form>
        </div>

        <div class="links">
            <a href="#" id="registerLink">Belum punya akun?</a>
        </div>
    </div>
    
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
